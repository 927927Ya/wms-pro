spring.datasource.url=jdbc:h2:mem:wms-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-h2.sql
spring.sql.init.encoding=UTF-8
# Disable MyBatis Plus auto-mapping if needed, but it should be fine
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
logging.level.com.d0dd.wms=DEBUG
# Allow bean overriding to resolve Shiro conflict
spring.main.allow-bean-definition-overriding=true
# Jackson Date Format
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8
spring.autoconfigure.exclude=org.apache.shiro.spring.config.web.autoconfigure.ShiroWebAutoConfiguration,org.apache.shiro.spring.config.web.autoconfigure.ShiroWebFilterConfiguration,org.apache.shiro.spring.boot.autoconfigure.ShiroAutoConfiguration
